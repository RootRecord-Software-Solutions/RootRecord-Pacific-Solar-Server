# ==============================================================================
# devices.conf — EcoFlow desk inventory (no secrets)
# ------------------------------------------------------------------------------
# HOW TO ADD A BLE DEVICE
#   1) Copy the TEMPLATE device section at the bottom of SECTION: BLE DEVICES.
#   2) Fill model, alias, sn, mac, name, eflib_module.
#   3) Do not invent a MAC. Expansion packs go under parent + [inventory].
#   4) User id / keys stay in master-key.env — never commit secrets.
#
# Layout style (standing): keep SECTION banners + TEMPLATE blocks.
# ==============================================================================

# ====================================================
# SECTION: PATHS
# Measured samples live under Database/ENERGY only.
# ====================================================
[paths]
energy_data=/home/rootrecord/RootRecord-Ecosystem/2 - RootRecord-Database/ENERGY
samples=/home/rootrecord/RootRecord-Ecosystem/2 - RootRecord-Database/ENERGY/samples
ports=/home/rootrecord/RootRecord-Ecosystem/2 - RootRecord-Database/ENERGY/ports
soc=/home/rootrecord/RootRecord-Ecosystem/2 - RootRecord-Database/ENERGY/soc
watts=/home/rootrecord/RootRecord-Ecosystem/2 - RootRecord-Database/ENERGY/watts
log_dir=/home/rootrecord/RootRecord-Ecosystem/2 - RootRecord-Database/Logs/Energy
ble_log=/home/rootrecord/RootRecord-Ecosystem/2 - RootRecord-Database/Logs/Energy/ava-ecoflow-ble.log
state_dir=/home/rootrecord/RootRecord-Ecosystem/2 - RootRecord-Database/ENERGY/state
# skill_root: Pacific Energy domain (2026-09-29). No code reads [paths]; G2 energy keeps its own config/devices.conf.
skill_root=/home/rootrecord/RootRecord-Ecosystem/1 - Servers/1 - RootRecord-Pacific-Solar-Server/Energy

# ====================================================
# SECTION: BLE DEVICES
# Each section is a real BLE connect target (has MAC + eflib module).
# ====================================================

# --- Delta 2 (B2) — primary station pack -----------------------------------------
[delta2]
prefer_api=0
model=Delta 2
alias=delta2
sn=R331ZAB5SG6S2858
mac=24:58:7C:20:92:61
role=unassigned
name=B2
eflib_module=eflib.devices.delta2
# B3 is an expansion battery on this unit (not a separate BLE target).
# When attached, eflib exposes it via battery_1_* / battery_2_* on a live read.
expansion_expected_sn=R331ZAB5SG755642
expansion_name=B3

# --- River 2 Pro (B1) — laptop AC + car DC --------------------------------------
[river2pro]
prefer_api=0
model=River 2 Pro
alias=river2pro
sn=R621ZA16XH6K1155
mac=DC:06:75:56:AC:1D
role=laptop_ac_car_dc
name=B1
eflib_module=eflib.devices.river2_pro

# --- TEMPLATE (new BLE device) — copy from here ---------------------------------
# [alias_here]
# model=Device Model Name
# alias=alias_here
# sn=SERIAL
# mac=AA:BB:CC:DD:EE:FF
# role=unassigned
# name=Bx
# eflib_module=eflib.devices.module_name
# --- end TEMPLATE ---------------------------------------------------------------

# ====================================================
# SECTION: INVENTORY (logical names — not BLE targets)
# B3 has no MAC — discovered through [delta2] when the pack is attached.
# If B3 is ever a standalone second Delta 2, add a full BLE section with mac=
# and eflib_module=; do not invent a MAC.
# ====================================================
[inventory]
bsec_alias=security
bsec_sn=R331ZAB5SG755642
bsec_name=B3
bsec_role=security
b1_alias=river2pro
b1_sn=R621ZA16XH6K1155
b1_name=B1
b2_alias=delta2
b2_sn=R331ZAB5SG6S2858
b2_name=B2
b3_parent_alias=delta2
b3_sn=R331ZAB5SG755642
b3_name=B3
b3_role=expansion

# ====================================================
# SECTION: BLE OWNER
# Single owner: systemd --user ava-ecoflow-ble.service — do not dual-start.
# ====================================================
[ble]
service=ava-ecoflow-ble.service
owner_script=/home/rootrecord/RootRecord-Ecosystem/1 - Servers/1 - RootRecord-Pacific-Solar-Server/Energy/scripts/ble/ble-owner.py
log_watch_interval_s=1
# Aggressive poll buckets NOT enabled yet
poll_enabled=0

# ====================================================
# SECTION: ENV (secrets location only — never paste values)
# ====================================================
[env]
# Central secrets only — master-key.env (EcoFlow keys from line 30+).
# Energy loads least-privilege allowlist via lib/envload.py.
# Required for live BLE: ECOFLOW_ACCOUNT_ID (or AVA_ECOFLOW_USER_ID if present).
env_files=/home/rootrecord/master/master-key.env

# --- Security battery (internal only, WiFi/API) -------------------------------
# --- Security / B3 (Delta 2 secondary) — internal only, API path -------------
# SN + display name come from master-key.env:
#   ECOFLOW_DELTA_2_SECONDARY / ECOFLOW_DELTA_2_SECONDARY_NAME
[security]
model=Delta 2
alias=security
sn=R331ZAB5SG755642
mac=
role=security
name=B3
eflib_module=eflib.devices.delta2
prefer_api=1
track=internal_only

