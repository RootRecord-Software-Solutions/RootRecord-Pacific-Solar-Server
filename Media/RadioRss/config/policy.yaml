# Fetch, overlap, priority, and narration policy.
# Change this file to retune the station. Do not hard-code these values in Python.

fetch:
  timeout_sec: 15
  connect_timeout_sec: 5
  retries: 3
  backoff_sec: 1
  max_bytes: 2000000
  user_agent: "RootRecord Radio RSS/1.0"
  max_redirects: 5
  max_feeds_per_run: 24
  max_items_per_feed: 20
  max_broadcast_age_hours: 36
  cluster_window_hours: 48
  similarity: 0.62
  unhealthy_after_failures: 5
  intervals_minutes:
    high: 10
    medium: 30
    low: 60

# Applied to every news feed. Native desks already cover quakes, volcanoes, and marine weather.
overlap_patterns:
  - earthquake
  - "seismic"
  - kilauea
  - "hawaiian volcano observatory"
  - "volcano alert"
  - "marine forecast"
  - "marine weather"
  - "small craft advisory"
  - "weather forecast"
  - "nws honolulu"
  - "gale warning"
  - "storm warning"
  - "tropical weather"
  - "high surf advisory"

# Item text that moves a story into another configured category.
category_rules:
  - category: spacex
    patterns: ["spacex", "starship", "falcon 9", "falcon heavy"]
  - category: universities
    patterns: ["university", "universities", "college research", "campus", "peer-reviewed study", "academic journal"]
  - category: chips
    patterns: ["nvidia", "cuda", "geforce", "tensor core", "semiconductor", "chipmaker", "foundry", " wafer", "gpu ", " gpus", "hbm3", "hbm4", "blackwell gpu", "hopper gpu", "microsoft", "azure", "openai", "google cloud", "alphabet", "amazon web services", " aws ", "meta platforms", "apple silicon", "tsmc", "taiwan semiconductor", "samsung electronics", "intel ", "amd ", "broadcom", "qualcomm", "arm holdings"]
  - category: maritime
    patterns: ["coast guard", "maritime", "vessel", "shipping", "ship collision", "marine casualty", "imo "]
  - category: aviation
    patterns: ["aircraft", "airliner", "faa", "runway", "aviation"]
  - category: cybersecurity
    patterns: ["cve-", "ransomware", "zero-day", "vulnerability"]

priority_floor:
  high: high
  medium: normal
  low: low

priority_signals:
  urgent:
    - "emergency directive"
    - "actively exploited"
    - "known exploited"
    - "major outage"
  high:
    - "breakthrough"
    - "peer-reviewed"
    - "nature journal"
    - "science journal"
    - "university study"
    - "launch"
    - "artemis"
    - "vulnerability"
    - "zero-day"
    - "cve-"
    - "investigation"
    - "aircraft accident"
    - "marine casualty"
    - "discovery"
    - "fomc"
    - "rate decision"
    - "press release"
  low: []

# science_offbeat stays under alerts, launches, and security items.
category_priority_cap:
  science_offbeat: normal

political_patterns:
  - election
  - candidate
  - parliament
  - congress
  - senator
  - "white house"
  - "prime minister"
  - ballot
  - "political party"
  - campaign

# Sentences matching these are left out of the spoken script.
drop_sentence_patterns:
  - "vote for"
  - "you should vote"
  - "cast your ballot"

# Whole news items dropped on every feed. Not a Hawaii opt-in. Measured weather desks are separate.
violence_patterns:
  - homicide
  - murder
  - manslaughter
  - shooting
  - "shot dead"
  - "shot and"
  - stabbed
  - stabbing
  - "sexual assault"
  - rape
  - robbery
  - gunman
  - gunfire
  - "domestic violence"
  - assault
  - killed
  - killing
  - deadly
  - death
  - deaths
  - died
  - dead
  - fatality
  - fatalities
  - gang
  - gangs
  - "fatal crash"
  - kidnapping
  - hostage


# Whole items dropped on feeds marked centrist: true. Keeps mainland politics desks on official and measured wording.
partisan_patterns:
  - "radical left"
  - "radical right"
  - "far-left"
  - "far-right"
  - "far left"
  - "far right"
  - "libtard"
  - "demonrat"
  - "maga republican"
  - "maga democrat"
  - "deep state"
  - "stolen election"
  - "rigged election"
  - "witch hunt"
  - "fascist democrat"
  - "fascist republican"
  - "communist democrat"
  - "communist republican"
  - " Traitor Trump"
  - " Traitor Biden"
  - "lock her up"
  - "lock him up"
  - "own the libs"
  - "own the conservatives"

# Whole items dropped from every feed. Keeps sports out of news and radio reports.
# Prefer /sports/ and league names. Do not use bare "sport" (matches transportation).
sports_patterns:
  # Paths and hosts (substring). League codes and the word "sports" use word edges in stories._sports_hit.
  - "/sports/"
  - "/sport/"
  - "/sport?"
  - "bbc.co.uk/sport"
  - "espn.com"
  - "espn."
  - "sports"
  - "nfl"
  - "nba"
  - "mlb"
  - "nhl"
  - "ncaa"
  - "wnba"
  - "mls"
  - "soccer"
  - "football"
  - "basketball"
  - "baseball"
  - "volleyball"
  - "hockey"
  - "cricket"
  - "rugby"
  - "nascar"
  - "formula 1"
  - "formula one"
  - "scoreboard"
  - "super bowl"
  - "world cup"
  - "premier league"
  - "march madness"
  - "asian games"
  - "olympics"
  - "olympic"
  - "boxing"
  - "ufc"
  - "pga tour"
  - "touchdown"
  - "home run"
  - "prep football"
  - "tennis"
  - "golf tournament"

