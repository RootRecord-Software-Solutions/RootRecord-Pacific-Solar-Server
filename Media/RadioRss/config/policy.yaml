# One hourly bulletin. Four desks, then other news if the script is still short.
# Voices leapfrog by the Hawaii hour: midnight Ava, 1 Bruce, 2 Carly, then the next desk takes the next voice.
news_update:
  report: news_update
  target_words: 750
  desk_words: 170
  fresh_hours: 18
  backfill_hours: 36
  roster: [ava, bruce, carly]
  desks:
    - id: markets
      name: Markets
      lead: "Markets."
      categories: [markets, economics_finance, energy_market]
    - id: defence
      name: National security
      lead: "National security."
      categories: [national_security]
    - id: spacex
      name: SpaceX
      lead: "SpaceX."
      categories: [spacex]
    - id: hawaii
      name: Hawaii
      lead: "Hawaii."
      categories: [hawaii]
    - id: also
      name: Also
      lead: "Also in the news."
      fill: true
      categories: [space, cybersecurity, science, technology, aviation, global_news, artificial_intelligence]

