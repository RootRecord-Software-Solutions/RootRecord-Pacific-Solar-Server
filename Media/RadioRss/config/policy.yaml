# One hourly bulletin aimed at about twenty to twenty-five spoken minutes (~150 words/min).
# Solar desk uses about five to seven minutes; remaining airtime (~20-25 min) fills here instead of sports.
# Weighting: tech/chips (NVIDIA, Microsoft, big tech), truly global world news (Asia, Australia, Africa,
# Europe, Latin America, Middle East, North America), U.S. mainland weather, more centrist mainland
# government/politics, universities, and science breakthroughs — plus markets, security, SpaceX, and Hawaii.
# Voices: Ava, Bruce, and Carly share the hour with roughly equal airtime; Hawaii hour still picks the first preference.
# Optional per-desk words override desk_words. Primary desks are polled by news-hour.
news_update:
  report: news_update
  target_words: 3600
  desk_words: 220
  fresh_hours: 18
  backfill_hours: 36
  roster: [ava, bruce, carly]
  desks:
    - id: markets
      name: Markets
      lead: "Markets."
      words: 220
      categories: [markets, economics_finance, energy_market]
    - id: defence
      name: National security
      lead: "National security."
      words: 260
      categories: [national_security]
    - id: spacex
      name: SpaceX
      lead: "SpaceX."
      words: 180
      categories: [spacex]
    - id: hawaii
      name: Hawaii
      lead: "Hawaii."
      words: 220
      categories: [hawaii]
    - id: chips
      name: Tech and chips
      lead: "Tech and chips."
      words: 420
      categories: [chips, artificial_intelligence, developer_ecosystem]
    - id: world
      name: World
      lead: "World."
      words: 520
      categories: [global_news]
    - id: mainland_weather
      name: Mainland weather
      lead: "Mainland weather."
      words: 360
      categories: [mainland_weather]
    - id: mainland_politics
      name: Mainland politics
      lead: "Mainland politics."
      words: 450
      categories: [mainland_politics]
    - id: science
      name: Science
      lead: "Science."
      words: 400
      categories: [science, research, science_offbeat]
    - id: universities
      name: Universities
      lead: "Universities."
      words: 340
      categories: [universities]
    - id: also
      name: Also
      lead: "Also in the news."
      fill: true
      words: 280
      categories: [space, cybersecurity, technology, aviation]

