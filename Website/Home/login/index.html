<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Root Record</title>
<meta name="description" content="Account entry for Root Record stays on this site. Sign-in is not open on this page yet.">
<link rel="canonical" href="https://www.rootrecord.cloud/login">
<meta property="og:title" content="Login — Root Record">
<meta property="og:description" content="Sign-in is not open on this page yet.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.rootrecord.cloud/login">
<meta property="og:site_name" content="Root Record">
<meta name="theme-color" content="#000011">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header class="top">
  <a class="brand" href="/">Root Record</a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" aria-label="Primary">
    <a href="/">Home</a>
    <a href="/products">Products</a>
    <a href="/services">Services</a>
    <a href="/solutions">Solutions</a>
    <a href="/about">About</a>
    <a href="/security">Security</a>
    <a href="/status">Status</a>
  </nav>
</header>
<main class="auth-stage" id="content">
  <section class="auth-box" aria-label="Login and signup">
    <h1>Account</h1>
    <div class="auth-switch" role="tablist" aria-label="Login or signup">
      <button type="button" id="tab-login" role="tab" aria-selected="true" aria-controls="form-login">Login</button>
      <button type="button" id="tab-signup" role="tab" aria-selected="false" aria-controls="form-signup">Signup</button>
    </div>
    <form id="form-login" role="tabpanel" aria-labelledby="tab-login">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="username" required>
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>
    <form id="form-signup" role="tabpanel" aria-labelledby="tab-signup" hidden>
      <label for="signup-email">Email</label>
      <input id="signup-email" name="email" type="email" autocomplete="username" required>
      <label for="signup-password">Password</label>
      <input id="signup-password" name="password" type="password" autocomplete="new-password" required>
      <button type="submit">Signup</button>
    </form>
    <p class="fine" id="auth-note" role="status">Sign-in is not open on this page yet.</p>
    <p class="fine"><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/data-deletion">Data deletion</a></p>
  </section>
</main>
<script src="/assets/shell.js"></script>
<script>
(function () {
  var loginTab = document.getElementById("tab-login");
  var signupTab = document.getElementById("tab-signup");
  var loginForm = document.getElementById("form-login");
  var signupForm = document.getElementById("form-signup");
  var note = document.getElementById("auth-note");
  function show(which) {
    var login = which === "login";
    loginTab.setAttribute("aria-selected", login ? "true" : "false");
    signupTab.setAttribute("aria-selected", login ? "false" : "true");
    loginForm.hidden = !login;
    signupForm.hidden = login;
    if (note) note.textContent = "Sign-in is not open on this page yet.";
  }
  loginTab.addEventListener("click", function () { show("login"); });
  signupTab.addEventListener("click", function () { show("signup"); });
  function hold(event) {
    event.preventDefault();
    if (note) note.textContent = "Sign-in is not open on this page yet.";
  }
  loginForm.addEventListener("submit", hold);
  signupForm.addEventListener("submit", hold);
})();
</script>
</body>
</html>
