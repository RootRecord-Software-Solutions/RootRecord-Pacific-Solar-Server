# Local route manifest for the one Vercel site.
# This file does not call Cloudflare and does not start cloudflared.
# Public web hosts 301 to https://rootrecord.online/. ssh stays. The poller stays on rootserver.

home_card: off
vercel_site: one
home_url: https://rootrecord.online/
routes:
  - hostname: www.rootrecord.cloud
    keep: true
    service: https://rootrecord.online/
    role: redirect
  - hostname: ssh.rootrecord.cloud
    keep: true
    service: ssh://localhost:22
    role: ssh
