# Production is https://www.rootrecord.cloud/ (Vercel project rootrecord, team rrc-ore).
# Apex redirects there. Other page hosts in this file are the desk target, also that URL.
# Other public web hosts 301 to https://www.rootrecord.cloud/.
# ssh.rootrecord.cloud is A 18.118.30.226, proxy off. rootserver stays the poller. play.rootmc.net stays the game.
# api.rootrecord.cloud is A 18.118.30.226, proxy off. Caddy on AWS proxies it to 127.0.0.1:8091.

home_card: off
vercel_site: one
home_url: https://www.rootrecord.cloud/
routes:
  - hostname: rootrecord.online
    keep: true
    service: https://www.rootrecord.cloud/
    role: redirect
  - hostname: www.rootrecord.online
    keep: true
    service: https://www.rootrecord.cloud/
    role: redirect
  - hostname: rootrecord.info
    keep: true
    service: https://www.rootrecord.cloud/
    role: redirect
  - hostname: www.rootrecord.info
    keep: true
    service: https://www.rootrecord.cloud/
    role: redirect
  - hostname: rootrecord.cloud
    keep: true
    service: https://www.rootrecord.cloud/
    role: redirect
  - hostname: www.rootrecord.cloud
    keep: true
    service: https://www.rootrecord.cloud/
    role: site
  - hostname: avaivy.cloud
    keep: true
    service: https://www.rootrecord.cloud/
    role: redirect
  - hostname: www.avaivy.cloud
    keep: true
    service: https://www.rootrecord.cloud/
    role: redirect
  - hostname: kilauea.cloud
    keep: true
    service: https://www.rootrecord.cloud/
    role: redirect
  - hostname: www.kilauea.cloud
    keep: true
    service: https://www.rootrecord.cloud/
    role: redirect
  - hostname: rootmc.net
    keep: true
    service: https://www.rootrecord.cloud/
    role: redirect
  - hostname: www.rootmc.net
    keep: true
    service: https://www.rootrecord.cloud/
    role: redirect
  - hostname: ssh.rootrecord.cloud
    keep: true
    service: 18.118.30.226:22
    role: ssh
  - hostname: rootserver.rootrecord.cloud
    keep: true
    service: http://127.0.0.1:8799
    role: poller
  - hostname: api.rootrecord.cloud
    keep: true
    service: http://127.0.0.1:8091
    role: status
  - hostname: play.rootmc.net
    keep: true
    service: stay
    role: game
